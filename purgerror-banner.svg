<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">ThePurgError — Build, play, repeat</title>
  <desc id="desc">A dark arcade-inspired developer banner with electric cyan and acid green accents, pixel motifs, and software, AI, and Minecraft PvP themes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e17"/><stop offset="0.55" stop-color="#10162a"/><stop offset="1" stop-color="#081b22"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#43e7ff" stop-opacity="0"/><stop offset="0.45" stop-color="#43e7ff" stop-opacity=".95"/><stop offset="1" stop-color="#b8ff5a" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#6e8ba7" stroke-opacity=".12" stroke-width="1"/></pattern>
    <pattern id="pixels" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="4" height="4" fill="#43e7ff" fill-opacity=".5"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="18" fill="url(#grid)"/>
  <path d="M0 218H1200" stroke="#43e7ff" stroke-opacity=".16"/>
  <path d="M0 219H740" stroke="url(#beam)" stroke-width="2"/>
  <path d="M770 0L650 280M1140 0L1020 280" stroke="#43e7ff" stroke-opacity=".07" stroke-width="2"/>
  <rect x="48" y="36" width="7" height="7" fill="#b8ff5a"/>
  <text x="68" y="43" fill="#b8ff5a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="2.5">PLAYER 01  /  DEVELOPER MODE</text>
  <text x="48" y="127" fill="#f0f6ff" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="800" letter-spacing="-1.7">THEPURGERROR</text>
  <rect x="50" y="151" width="36" height="4" rx="2" fill="#b8ff5a"/>
  <rect x="93" y="151" width="15" height="4" rx="2" fill="#43e7ff"/>
  <text x="50" y="183" fill="#c4d1e3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" letter-spacing="1.3">SOFTWARE  /  AI  /  MINECRAFT PVP</text>
  <text x="50" y="249" fill="#7787a0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="2">BUILD SOMETHING. THEN MAKE IT BETTER.</text>
  <!-- abstract pixel signal -->
  <g transform="translate(830 47)">
    <path d="M0 0H278V166H0Z" fill="#09101b" fill-opacity=".7" stroke="#2b455a" stroke-width="1.2"/>
    <path d="M0 25H278" stroke="#2b455a"/>
    <circle cx="16" cy="13" r="3" fill="#ff6389"/><circle cx="28" cy="13" r="3" fill="#b8ff5a"/><circle cx="40" cy="13" r="3" fill="#43e7ff"/>
    <text x="57" y="17" fill="#71869f" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1">WORKBENCH.EXE</text>
    <g transform="translate(18 42)">
      <rect x="0" y="0" width="58" height="58" fill="#102a38" stroke="#43e7ff" stroke-opacity=".8"/>
      <path d="M12 12H28V28H44V44H28V28H12Z" fill="#43e7ff" filter="url(#glow)"/>
      <rect x="72" y="0" width="58" height="58" fill="#192631" stroke="#b8ff5a" stroke-opacity=".8"/>
      <path d="M84 16H118V24H110V42H92V24H84Z" fill="#b8ff5a"/>
      <rect x="144" y="0" width="58" height="58" fill="#221b35" stroke="#ff6389" stroke-opacity=".8"/>
      <path d="M158 14H188V22H180V38H172V46H164V30H158Z" fill="#ff6389"/>
      <rect x="0" y="72" width="202" height="5" fill="#25394c"/>
      <rect x="0" y="72" width="121" height="5" fill="#43e7ff"/>
      <rect x="0" y="88" width="166" height="5" fill="#25394c"/>
      <rect x="0" y="88" width="92" height="5" fill="#b8ff5a"/>
    </g>
  </g>
  <g fill="url(#pixels)" opacity=".55"><rect x="1110" y="220" width="54" height="36"/><rect x="770" y="18" width="36" height="54"/></g>
  <rect x="1174" y="38" width="3" height="38" fill="#b8ff5a"/>
  <rect x="1181" y="38" width="3" height="22" fill="#43e7ff"/>
</svg>
